services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent
    restart: unless-stopped
    depends_on:
      agent-db:
        condition: service_healthy
      agent-redis:
        condition: service_healthy 
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - agora-network

  agent-db:
    image: postgres:18-alpine
    container_name: agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
      PGDATA: /var/lib/postgresql/18/data
    ports:
      - "5436:5432"
    volumes:
      - agent_db_data:/var/lib/postgresql
      - ./db/init/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/init/002_class_plans.sql:/docker-entrypoint-initdb.d/002_class_plans.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agora-network

  agent-redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - agora-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  agent_db_data:

networks:
  agora-network:
    external: true
    name: agora-network
